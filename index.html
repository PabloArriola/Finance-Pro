<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Pro — Gestión de Gastos</title>
    <!-- Chart.js y Tabler Icons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <style>
        /* Estilos base mejorados */
        :root {
            --bg: #fdfcf9; --surface: #ffffff; --surface2: #f1f0eb;
            --border: rgba(0,0,0,0.08); --text: #1d1d1b; --text2: #6a6964;
            --blue: #2563eb; --green: #059669; --red: #dc2626; --amber: #d97706;
            --radius: 12px;
        }
        @media(prefers-color-scheme:dark){
            :root {
                --bg: #121211; --surface: #1c1c1a; --surface2: #262624;
                --border: rgba(255,255,255,0.1); --text: #ecece7; --text2: #a1a19a;
            }
        }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        .container { max-width: 1000px; margin: 0 auto; padding: 2rem 1rem; }
        
        /* Pantalla de Login */
        #auth-screen { 
            height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            text-align: center; background: var(--bg);
        }
        .btn-login { 
            background: var(--text); color: var(--bg); padding: 12px 24px; border-radius: 30px; 
            border: none; cursor: pointer; display: flex; align-items: center; gap: 10px; font-weight: 600;
        }

        /* App Content (Hidden by default) */
        #app-content { display: none; }

        /* Header con Selector de Periodo */
        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .period-selector { 
            display: flex; align-items: center; gap: 15px; background: var(--surface2); 
            padding: 8px 16px; border-radius: 40px; border: 1px solid var(--border);
        }
        .period-btn { background: none; border: none; cursor: pointer; color: var(--text); font-size: 1.2rem; }
        #display-periodo { font-weight: 700; min-width: 120px; text-align: center; }

        /* KPIs y Cards */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; }
        .kpi { padding: 1.5rem; }
        .kpi-val { font-size: 1.5rem; font-weight: 800; margin: 5px 0; }
        
        /* Tablas e Items */
        .item-row { 
            display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border);
            transition: all 0.2s;
        }
        .item-row:hover { background: var(--surface2); border-radius: 8px; }
        .item-name { flex: 1; font-size: 0.9rem; }
        .item-amt { font-weight: 700; min-width: 100px; text-align: right; }
        .item-del { color: var(--text2); cursor: pointer; padding: 5px; opacity: 0.3; }
        .item-row:hover .item-del { opacity: 1; }

        /* Formularios */
        .form-add { display: flex; gap: 10px; margin-top: 1rem; }
        input, select { 
            background: var(--surface2); border: 1px solid var(--border); 
            color: var(--text); padding: 8px 12px; border-radius: 8px; outline: none;
        }
        input:focus { border-color: var(--blue); }
        .btn-add { background: var(--blue); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }

        /* Toast & Loading */
        #loading { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: var(--blue); z-index: 999; display: none; }
    </style>
</head>
<body>

    <div id="loading"></div>

    <!-- PANTALLA DE AUTENTICACIÓN -->
    <div id="auth-screen">
        <i class="ti ti-wallet" style="font-size: 4rem; color: var(--blue); margin-bottom: 1rem;"></i>
        <h1>Finance Pro</h1>
        <p style="color: var(--text2); margin-bottom: 2rem;">Gestiona tus finanzas de forma segura con Google</p>
        <button class="btn-login" onclick="login()">
            <i class="ti ti-brand-google"></i> Iniciar sesión con Google
        </button>
    </div>

    <!-- CONTENIDO DE LA APP -->
    <div id="app-content" class="container">
        <header class="app-header">
            <div>
                <h2 id="user-welcome">Hola, —</h2>
                <div class="period-selector">
                    <button class="period-btn" onclick="cambiarPeriodo(-1)"><i class="ti ti-chevron-left"></i></button>
                    <span id="display-periodo">Mes Año</span>
                    <button class="period-btn" onclick="cambiarPeriodo(1)"><i class="ti ti-chevron-right"></i></button>
                </div>
            </div>
            <button class="icon-btn" onclick="logout()" title="Cerrar Sesión"><i class="ti ti-logout"></i></button>
        </header>

        <div class="kpi-grid">
            <div class="card kpi">
                <small><i class="ti ti-arrow-up-circle"></i> Ingresos</small>
                <div class="kpi-val" id="total-ingresos" style="color: var(--green);">$0</div>
            </div>
            <div class="card kpi">
                <small><i class="ti ti-lock"></i> Gastos Fijos</small>
                <div class="kpi-val" id="total-fijos" style="color: var(--red);">$0</div>
            </div>
            <div class="card kpi">
                <small><i class="ti ti-shopping-cart"></i> Gastos Diarios</small>
                <div class="kpi-val" id="total-diarios" style="color: var(--amber);">$0</div>
            </div>
            <div class="card kpi">
                <small><i class="ti ti-scale"></i> Saldo Neto</small>
                <div class="kpi-val" id="total-neto">$0</div>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
            <!-- Column Izquierda: Tablas -->
            <div>
                <h3>Ingresos y Gastos Fijos</h3>
                <div class="card" style="margin-bottom: 1rem;">
                    <div id="list-ingresos"></div>
                    <div class="form-add">
                        <input type="text" id="add-ing-name" placeholder="Nueva fuente..." style="flex:2">
                        <input type="number" id="add-ing-amt" placeholder="Monto" style="flex:1">
                        <button class="btn-add" onclick="addIngreso()">+</button>
                    </div>
                </div>

                <div class="card">
                    <div id="list-fijos"></div>
                    <div class="form-add">
                        <select id="add-fijo-cat" style="flex:1"></select>
                        <input type="text" id="add-fijo-name" placeholder="Gasto fijo..." style="flex:2">
                        <input type="number" id="add-fijo-amt" placeholder="Monto" style="flex:1">
                        <button class="btn-add" onclick="addFijo()">+</button>
                    </div>
                </div>
            </div>

            <!-- Column Derecha: Diarios y Gráfico -->
            <div>
                <h3>Registro Diario</h3>
                <div class="card">
                    <canvas id="chartCategorias" height="200"></canvas>
                    <hr style="border: 0; border-top: 1px solid var(--border); margin: 1.5rem 0;">
                    <div id="list-diarios" style="max-height: 300px; overflow-y: auto;"></div>
                    <div class="form-add" style="flex-direction: column;">
                        <select id="add-dia-cat" style="width: 100%;"></select>
                        <input type="text" id="add-dia-desc" placeholder="Descripción..." style="width: 100%;">
                        <input type="number" id="add-dia-amt" placeholder="Monto" style="width: 100%;">
                        <button class="btn-add" onclick="addDiario()" style="width: 100%;">Registrar Gasto</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURACIÓN (REEMPLAZAR AQUÍ) ---
const WEBAPP_URL = "https://script.google.com/macros/s/AKfyc...TU_URL_REAL.../exec";
const API_KEY = "PabloFinanzas2024_XyZ9!"; // La misma que pusiste en el .gs
const CORREOS_PERMITIDOS = ["arriolapablo.a@gmail.com", "agusferrari94@gmail.com"];

const firebaseConfig = {
  apiKey: "AIzaSyBi8Mf5FWib1d-gvTIkXiQhB8cEC18TVrk",
  authDomain: "finanzas-pro-3c0f9.firebaseapp.com",
  projectId: "finanzas-pro-3c0f9",
  storageBucket: "finanzas-pro-3c0f9.firebasestorage.app",
  messagingSenderId: "472354922844",
  appId: "1:472354922844:web:6551e265f5900b4abde199"
};

        // --- 2. ESTADO GLOBAL ---
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        let DATA = { ingresos: [], gastosFijos: [], gastosDiarios: [] };
        let periodoActual = { mes: new Date().getMonth(), anio: new Date().getFullYear() };
        let chartObj = null;

        const CATS = [
            { n: 'Servicios', c: '#3b82f6' }, { n: 'Vivienda', c: '#10b981' },
            { n: 'Comida', c: '#f59e0b' }, { n: 'Transporte', c: '#6b7280' },
            { n: 'Ocio', c: '#a855f7' }, { n: 'Salud', c: '#ef4444' }
        ];

        // --- 3. AUTENTICACIÓN ---
        function login() { auth.signInWithPopup(provider); }
        function logout() { auth.signOut(); location.reload(); }

        auth.onAuthStateChanged(user => {
            if (user && CORREOS_PERMITIDOS.includes(user.email)) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';
                document.getElementById('user-welcome').textContent = `Hola, ${user.displayName.split(' ')[0]}`;
                init();
            } else if (user) {
                // ESTA LÍNEA ES LA MAGIA: Nos dirá exactamente qué correo intentó entrar
                alert("Acceso denegado para el correo: [" + user.email + "]. Asegúrate de que esté en la lista.");
                auth.signOut();
            }
        });
        // --- 4. BACKEND ENGINE (JSONP) ---
        async function api(action, payload = {}) {
            document.getElementById('loading').style.display = 'block';
            const periodo = `${periodoActual.mes + 1}-${periodoActual.anio}`;
            const url = new URL(WEBAPP_URL);
            url.searchParams.append('key', API_KEY);
            url.searchParams.append('action', action);
            url.searchParams.append('periodo', periodo);
            if (Object.keys(payload).length) url.searchParams.append('data', JSON.stringify(payload));

            return new Promise((resolve) => {
                const cb = 'cb_' + Math.random().toString(36).substring(7);
                window[cb] = (d) => {
                    delete window[cb];
                    document.getElementById('loading').style.display = 'none';
                    resolve(d);
                };
                const s = document.createElement('script');
                url.searchParams.append('callback', cb);
                s.src = url.toString();
                document.head.appendChild(s);
            });
        }

        // --- 5. LOGICA DE NEGOCIO ---
        async function init() {
            // Poblar selects
            const selects = ['add-fijo-cat', 'add-dia-cat'];
            selects.forEach(s => {
                const el = document.getElementById(s);
                el.innerHTML = CATS.map(c => `<option value="${c.n}">${c.n}</option>`).join('');
            });
            updatePeriodDisplay();
            await fetchData();
        }

        function updatePeriodDisplay() {
            const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            document.getElementById('display-periodo').textContent = `${meses[periodoActual.mes]} ${periodoActual.anio}`;
        }

        async function cambiarPeriodo(n) {
            periodoActual.mes += n;
            if (periodoActual.mes > 11) { periodoActual.mes = 0; periodoActual.anio++; }
            if (periodoActual.mes < 0) { periodoActual.mes = 11; periodoActual.anio--; }
            updatePeriodDisplay();
            await fetchData();
        }

        async function fetchData() {
            const res = await api('read');
            if (res.ok) {
                DATA = res;
                renderAll();
            }
        }

        // --- 6. RENDERERS ---
        function renderAll() {
            renderList('Ingresos', 'list-ingresos', DATA.ingresos, 'green');
            renderList('GastosFijos', 'list-fijos', DATA.gastosFijos, 'red');
            renderListDiarios();
            updateKPIs();
            renderChart();
        }

        function renderList(type, elementId, items, color) {
            const el = document.getElementById(elementId);
            el.innerHTML = items.map(i => `
                <div class="item-row">
                    <span class="item-name">${i.concepto || i.categoria}</span>
                    <span class="item-amt" style="color:var(--${color})">$${Math.round(i.monto).toLocaleString()}</span>
                    <i class="ti ti-trash item-del" onclick="deleteItem('${type}', '${i.id}')"></i>
                </div>
            `).join('');
        }

        function renderListDiarios() {
            const el = document.getElementById('list-diarios');
            if(!DATA.gastosDiarios.length) { el.innerHTML = '<p style="font-size:12px;color:var(--text2);text-align:center">Sin gastos hoy</p>'; return; }
            el.innerHTML = DATA.gastosDiarios.map(i => `
                <div class="item-row">
                    <div style="flex:1">
                        <div class="item-name" style="font-weight:600">${i.desc}</div>
                        <small style="color:var(--text2); font-size:10px">${i.categoria}</small>
                    </div>
                    <span class="item-amt">$${Math.round(i.monto).toLocaleString()}</span>
                    <i class="ti ti-trash item-del" onclick="deleteItem('Diarios', '${i.id}')"></i>
                </div>
            `).join('');
        }

        function updateKPIs() {
            const ing = DATA.ingresos.reduce((a, b) => a + b.monto, 0);
            const fij = DATA.gastosFijos.reduce((a, b) => a + b.monto, 0);
            const dia = DATA.gastosDiarios.reduce((a, b) => a + b.monto, 0);
            const neto = ing - fij - dia;

            document.getElementById('total-ingresos').textContent = `$${Math.round(ing).toLocaleString()}`;
            document.getElementById('total-fijos').textContent = `$${Math.round(fij).toLocaleString()}`;
            document.getElementById('total-diarios').textContent = `$${Math.round(dia).toLocaleString()}`;
            document.getElementById('total-neto').textContent = `$${Math.round(neto).toLocaleString()}`;
            document.getElementById('total-neto').style.color = neto >= 0 ? 'var(--green)' : 'var(--red)';
        }

        // --- 7. ACCIONES ---
        async function addIngreso() {
            const concepto = document.getElementById('add-ing-name').value;
            const monto = parseFloat(document.getElementById('add-ing-amt').value);
            if (!concepto || !monto) return;
            const res = await api('addIngreso', { concepto, monto, periodo: `${periodoActual.mes + 1}-${periodoActual.anio}` });
            if (res.ok) { init(); document.getElementById('add-ing-name').value = ''; document.getElementById('add-ing-amt').value = ''; }
        }

        async function addFijo() {
            const cat = document.getElementById('add-fijo-cat').value;
            const concepto = document.getElementById('add-fijo-name').value;
            const monto = parseFloat(document.getElementById('add-fijo-amt').value);
            if (!concepto || !monto) return;
            const res = await api('addGastoFijo', { cat, concepto, monto, periodo: `${periodoActual.mes + 1}-${periodoActual.anio}` });
            if (res.ok) { init(); document.getElementById('add-fijo-name').value = ''; document.getElementById('add-fijo-amt').value = ''; }
        }

        async function addDiario() {
            const cat = document.getElementById('add-dia-cat').value;
            const desc = document.getElementById('add-dia-desc').value;
            const monto = parseFloat(document.getElementById('add-dia-amt').value);
            if (!desc || !monto) return;
            const res = await api('addDiario', { cat, desc, monto });
            if (res.ok) { init(); document.getElementById('add-dia-desc').value = ''; document.getElementById('add-dia-amt').value = ''; }
        }

        async function deleteItem(sheet, id) {
            if (!confirm("¿Eliminar este registro?")) return;
            const res = await api('delete', { sheet, id });
            if (res.ok) init();
        }

        function renderChart() {
            const ctx = document.getElementById('chartCategorias').getContext('2d');
            const totals = {};
            [...DATA.gastosFijos, ...DATA.gastosDiarios].forEach(g => {
                const cat = g.categoria || 'Varios';
                totals[cat] = (totals[cat] || 0) + g.monto;
            });

            const labels = Object.keys(totals);
            const values = Object.values(totals);
            const colors = labels.map(l => CATS.find(c => c.n === l)?.c || '#eee');

            if (chartObj) chartObj.destroy();
            chartObj = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels,
                    datasets: [{ data: values, backgroundColor: colors, borderWidth: 0 }]
                },
                options: { 
                    responsive: true, 
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } } 
                }
            });
        }
    </script>
</body>
</html>
